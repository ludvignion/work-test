<meta charset="utf-8">
<title>UNS Explorer</title>
<style>
:root{
  color-scheme:dark;
  --ground:#0A0C0F; --surface:#11151A; --surface2:#171C22; --surface3:#1F252D;
  --line:#232A32; --line2:#2E3640; --text:#E7ECF1; --muted:#8793A0; --faint:#56616D;
  --grid:rgba(255,255,255,.045); --edge:#39434E;
  --pin:#FFD166; --hit:#6EE7A0; --noise:#FF7A7A;
  --lv-enterprise:#A7B1BC; --lv-site:#7FA8FF; --lv-function:#C4A1FF; --lv-area:#56D6C2;
  --lv-line:#FFA56B; --lv-cell:#F08DB8; --lv-tag:#7D8893;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#F3F5F7; --surface:#FFFFFF; --surface2:#F4F6F8; --surface3:#E9EDF1;
  --line:#DCE2E8; --line2:#C9D1D9; --text:#12161B; --muted:#5A6672; --faint:#8C97A2;
  --grid:rgba(15,25,35,.07); --edge:#B7C0C9;
  --pin:#C98700; --hit:#12955A; --noise:#D43F3F;
  --lv-enterprise:#5E6B78; --lv-site:#3565D9; --lv-function:#7E4FD6; --lv-area:#0E9985;
  --lv-line:#D2641C; --lv-cell:#C2437A; --lv-tag:#6B7682;
  --shadow:0 12px 36px rgba(20,30,40,.14);
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px;padding-block:0 16px;gap:12px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:15px;margin-right:auto}
.brand svg{display:block}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.02em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg kbd{font:11px var(--mono);color:var(--faint)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;min-height:0}
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background-color:var(--surface);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#svg.panning{cursor:grabbing}
.tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}

/* nodes */
.node{cursor:pointer}
.node rect{fill:color-mix(in srgb,var(--c) 13%,var(--surface));stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:1;transition:fill .5s,stroke .3s}
.node text.lb{fill:var(--text);font:500 12px var(--sans);pointer-events:none}
.node.tag rect{fill:var(--surface2);stroke:var(--line2)}
.node.tag text.lb{font:11px var(--mono);fill:var(--muted)}
.view-graph .node.tag rect{fill:color-mix(in srgb,var(--lv-tag) 70%,var(--surface));stroke:none}
.view-graph .node rect{fill:color-mix(in srgb,var(--c) 22%,var(--surface))}
.view-graph .node text.lb{font-size:11px;fill:var(--muted)}
.node .dot{fill:var(--c)}
.node .badge rect{fill:var(--surface3);stroke:var(--line2)}
.node .badge text{font:600 10.5px var(--mono);fill:var(--muted);pointer-events:none}
.node:hover rect{stroke:var(--text)}
.node.onpath rect{stroke:color-mix(in srgb,var(--pin) 70%,transparent)}
.node.pinned rect{stroke:var(--pin);stroke-width:2;fill:color-mix(in srgb,var(--pin) 18%,var(--surface));filter:drop-shadow(0 0 7px color-mix(in srgb,var(--pin) 55%,transparent))}
.view-graph .node.pinned rect{fill:var(--pin)}
.node.pinned text.lb{fill:var(--pin)!important;font-weight:600}
.edge{fill:none;stroke:var(--edge);stroke-width:1.1}
.edge.onpath{stroke:var(--pin);stroke-width:2}
.lv-enterprise{--c:var(--lv-enterprise)}.lv-site{--c:var(--lv-site)}.lv-function{--c:var(--lv-function)}
.lv-area{--c:var(--lv-area)}.lv-line{--c:var(--lv-line)}.lv-cell{--c:var(--lv-cell)}.lv-tag{--c:var(--lv-tag)}

.querying .node.q-out > *{opacity:.16}
.querying .edge.q-out{opacity:.12}
.querying .node.q-hit.tag rect{fill:color-mix(in srgb,var(--hit) 28%,var(--surface));stroke:var(--hit)}
.querying .node.q-noise.tag rect{fill:color-mix(in srgb,var(--noise) 20%,var(--surface));stroke:var(--noise)}
.querying.view-graph .node.q-hit.tag rect{fill:var(--hit)}
.querying.view-graph .node.q-noise.tag rect{fill:var(--noise)}

/* pinned path overlay */
.pin{position:absolute;left:12px;right:12px;bottom:12px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line2);border-radius:12px;padding:12px 16px 12px;box-shadow:var(--shadow)}
.pin-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pin-meta{font:12px var(--mono);color:var(--muted)}
.path{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 0;margin-top:8px;font-family:var(--mono)}
.ps{display:inline-flex;flex-direction:column;align-items:flex-start;padding:0 1px}
.ps .v{font-size:16px;font-weight:600;color:var(--c);line-height:1.3}
.ps .l{font:9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:1px}
.ps.lv-tag .v{color:var(--pin)}
.sl{font-size:16px;color:var(--faint);padding:0 3px;line-height:1.3}
.pin-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font:12px var(--mono);color:var(--muted)}
.pin-foot .was{color:var(--faint);overflow-wrap:anywhere}
.pin-foot .was b{font-weight:500;color:var(--muted);font-family:var(--sans)}

/* side panel */
aside{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.alt-name{font-size:20px;font-weight:650;letter-spacing:-.02em;margin:0;text-wrap:balance}
.alt-desc{color:var(--muted);margin:4px 0 12px;font-size:13px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 8px 3px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chain .arr{color:var(--faint);font-size:11px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10.5px;font-weight:600;color:var(--faint);text-align:right;padding:0 0 6px;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{padding:8px 0;text-align:right;border-top:1px solid var(--line);font-size:13px}
td:first-child{font-weight:550}
tbody tr{cursor:pointer}
tbody tr:hover td{color:var(--text)}
tbody tr[aria-current="true"] td{color:var(--pin)}
tbody tr:not([aria-current="true"]) td{color:var(--muted)}
td .n{font-family:var(--mono);font-size:12.5px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qchips button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.qchips button[aria-pressed="true"]{background:var(--surface3);color:var(--text);border-color:var(--muted)}
.pattern{font:13px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;overflow-wrap:anywhere}
.pattern .w{color:var(--pin);font-weight:700}
.pattern .k{color:var(--faint)}
.qnums{display:flex;gap:20px;margin:12px 0 8px}
.qnums div{display:flex;flex-direction:column}
.qnums b{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.qnums span{font-size:11.5px;color:var(--muted)}
.qnums .h b{color:var(--hit)} .qnums .x b{color:var(--noise)}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--noise) 55%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hit);border-radius:99px;transition:width .6s cubic-bezier(.6,0,.2,1)}
.switch{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--surface3);border:1px solid var(--line2);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:color-mix(in srgb,var(--hit) 35%,var(--surface3))}
.switch input:checked::after{transform:translateX(14px);background:var(--hit)}

/* tooltip */
.tip{position:fixed;z-index:10;pointer-events:none;min-width:230px;max-width:340px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tip-h b{font:600 14px var(--mono)}
.tip-p{font:11.5px var(--mono);color:var(--muted);margin:6px 0 10px;overflow-wrap:anywhere}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12.5px}
.tip dt{color:var(--faint)} .tip dd{margin:0;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:72vh;min-height:460px}
  .seg kbd{display:none}
}
@media (max-width:520px){
  .seg button{padding:6px 8px;font-size:12px}
  .ps .v,.sl{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="4" cy="11" r="2.6" fill="var(--lv-site)"/><circle cx="17" cy="4.5" r="2.2" fill="var(--lv-area)"/><circle cx="17" cy="11" r="2.2" fill="var(--lv-line)"/><circle cx="17" cy="17.5" r="2.2" fill="var(--lv-cell)"/><path d="M6.5 11C11 11 11 4.5 14.8 4.5M6.5 11h8.3M6.5 11c4.5 0 4.5 6.5 8.3 6.5" stroke="var(--edge)" stroke-width="1.3" fill="none"/></svg>
      UNS Explorer <small>mock-up · fake data</small>
    </div>
    <div class="seg" id="altSeg" role="group" aria-label="Alternative"></div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button id="vTree" data-view="tree"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 7h3m0 0V2.5h3M4.5 7h3m-3 0v4.5h3" stroke="currentColor" fill="none" stroke-width="1.4"/><rect x="8" y="1" width="5" height="3" rx="1" fill="currentColor"/><rect x="8" y="5.5" width="5" height="3" rx="1" fill="currentColor"/><rect x="8" y="10" width="5" height="3" rx="1" fill="currentColor"/></svg>Tree</button>
      <button id="vGraph" data-view="graph"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 7 2.5 3M7 7l4.5-2M7 7l-3 4.5M7 7l4 4" stroke="currentColor" stroke-width="1.2"/><circle cx="7" cy="7" r="2.6" fill="currentColor"/><circle cx="2.5" cy="3" r="1.5" fill="currentColor"/><circle cx="11.5" cy="5" r="1.5" fill="currentColor"/><circle cx="4" cy="11.5" r="1.5" fill="currentColor"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/></svg>Graph</button>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke="currentColor" fill="none" stroke-width="1.2"/></svg>
    </button>
  </header>

  <main>
    <div class="stage" id="stage">
      <svg id="svg" aria-label="UNS structure"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
      <div class="tools">
        <button class="iconbtn" id="zin" aria-label="Zoom in" title="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button class="iconbtn" id="zout" aria-label="Zoom out" title="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button class="iconbtn" id="fit" aria-label="Fit to view" title="Fit to view"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 5V1.5H5M9 1.5h3.5V5M12.5 9v3.5H9M5 12.5H1.5V9" stroke="currentColor" fill="none" stroke-width="1.5"/></svg></button>
      </div>
      <div class="pin" id="pin">
        <div class="pin-top"><span class="eyebrow">Pinned tag · topic path</span><span class="pin-meta" id="pinMeta"></span></div>
        <div class="path" id="path"></div>
        <div class="pin-foot"><span id="pinStats"></span><span class="was" id="pinWas"></span></div>
      </div>
    </div>

    <aside>
      <section class="card">
        <h2>Alternative</h2>
        <p class="alt-name" id="altName"></p>
        <p class="alt-desc" id="altDesc"></p>
        <div class="chain" id="chain"></div>
      </section>
      <section class="card">
        <h2>Shape</h2>
        <table>
          <thead><tr><th></th><th>Depth</th><th>Nodes</th><th>Avg children</th><th>Matches</th></tr></thead>
          <tbody id="shape"></tbody>
        </table>
      </section>
      <section class="card">
        <h2>One wildcard subscription</h2>
        <div class="qchips" id="qchips"></div>
        <div class="pattern" id="pattern"></div>
        <div class="qnums">
          <div><b id="qMatch"></b><span>tags received</span></div>
          <div class="h"><b id="qWant"></b><span>actually wanted</span></div>
          <div class="x"><b id="qNoise"></b><span>filtered in client</span></div>
        </div>
        <div class="bar"><i id="qBar"></i></div>
        <label class="switch" for="hl"><input type="checkbox" id="hl"> Highlight on map</label>
      </section>
    </aside>
  </main>
</div>
<div class="tip" id="tip"></div>

<script>
(() => {
/* ---------- fake plant ---------- */
const ENT = 'demo-dairy', SITE = 'plant-1';
const LEVEL = {enterprise:'Enterprise', site:'Site', function:'Function', area:'Area', line:'Line', cell:'Cell', tag:'Tag'};
const S7 = 'PLC · Siemens S7-1500', CL = 'PLC · Rockwell CompactLogix', MES = 'MES', LIMS = 'LIMS',
      EM = 'Energy meter · Modbus TCP', CM = 'Condition monitoring', DEG = '°C', NA = '–';
const T = (name, fn, dt, unit, src, rate) => ({name, fn, dt, unit, src, rate});
const CELLS = {
  pump: [T('flow','process','Float','L/min','plc','1 s'), T('pressure','process','Float','bar','plc','1 s'), T('motor-current','maintenance','Float','A','plc','1 s'), T('run-hours','maintenance','Int32','h','plc','1 min'), T('energy','energy','Float','kWh',EM,'15 min')],
  separator: [T('bowl-speed','process','Float','rpm','plc','1 s'), T('vibration','maintenance','Float','mm/s',CM,'10 s'), T('fat-content','quality','Float','%',LIMS,'per sample'), T('energy','energy','Float','kWh',EM,'15 min')],
  silo: [T('level','process','Float','%','plc','5 s'), T('temp','quality','Float',DEG,'plc','5 s'), T('agitator-state','maintenance','Bool',NA,'plc','on change'), T('batch-id','production','String',NA,MES,'on change')],
  heater: [T('temp-in','process','Float',DEG,'plc','1 s'), T('temp-out','process','Float',DEG,'plc','1 s'), T('steam-valve','process','Float','%','plc','1 s'), T('energy','energy','Float','kWh',EM,'15 min')],
  holding: [T('temp','quality','Float',DEG,'plc','500 ms'), T('divert-valve','quality','Bool',NA,'plc','on change'), T('hold-time','quality','Float','s','plc','1 s')],
  cooler: [T('temp-out','process','Float',DEG,'plc','1 s'), T('glycol-flow','process','Float','L/min','plc','1 s'), T('energy','energy','Float','kWh',EM,'15 min')],
  vat: [T('temp','process','Float',DEG,'plc','2 s'), T('ph','quality','Float','pH',LIMS,'per sample'), T('stirrer-speed','process','Float','rpm','plc','1 s'), T('cip-step','maintenance','String',NA,'plc','on change'), T('batch-id','production','String',NA,MES,'on change')],
  press: [T('pressure','process','Float','bar','plc','1 s'), T('cycle-count','production','Int32','cycles','plc','on change'), T('hydraulic-temp','maintenance','Float',DEG,CM,'10 s')],
  filler: [T('count','production','Int32','pcs','plc','on change'), T('fill-weight','quality','Float','g','plc','per unit'), T('reject-count','quality','Int32','pcs','plc','on change'), T('state','production','String',NA,MES,'on change'), T('energy','energy','Float','kWh',EM,'15 min')],
  capper: [T('torque','quality','Float','N·m','plc','per unit'), T('speed','process','Float','caps/min','plc','1 s'), T('fault-code','maintenance','Int16',NA,'plc','on change')],
  palletizer: [T('pallets','production','Int32','pallets','plc','on change'), T('motor-current','maintenance','Float','A','plc','1 s'), T('energy','energy','Float','kWh',EM,'15 min')],
};
const AREAS = [
  {id:'intake', plc:S7, lines:['bay-1','bay-2'], cells:['pump','separator','silo']},
  {id:'pasteur', plc:S7, lines:['htst-1','htst-2'], cells:['heater','holding','cooler']},
  {id:'cheese', plc:CL, lines:['vat-a','vat-b'], cells:['vat','press']},
  {id:'packing', plc:CL, lines:['filler-1','filler-2'], cells:['filler','capper','palletizer']},
];
const AREA_OF = {};
const TAGS = [];
for (const a of AREAS) for (const line of a.lines) {
  AREA_OF[line] = a.id;
  for (const cell of a.cells) for (const t of CELLS[cell])
    TAGS.push({id:`${line}.${cell}.${t.name}`, area:a.id, line, cell, name:t.name, fn:t.fn, dt:t.dt, unit:t.unit, src:t.src === 'plc' ? a.plc : t.src, rate:t.rate});
}

const ALTS = [
  {id:'isa', name:'ISA-95 strict', levels:['enterprise','site','area','line','cell'], desc:'Location first. Every tag sits where it lives on the plant floor.'},
  {id:'func', name:'Functional-first', levels:['enterprise','site','function','area','line','cell'], desc:'Purpose first. The same line repeats under every function it serves.'},
  {id:'flat', name:'Flat', levels:['enterprise','site','line'], desc:'Three levels to a tag. Area and cell fold into the tag name.'},
];
const QUERIES = [
  {label:'Quality in pasteurisation', q:{function:'quality', area:'pasteur'}},
  {label:'Everything on filler-1', q:{area:'packing', line:'filler-1'}},
  {label:'All energy meters', q:{function:'energy'}},
];

const attr = (t, l) => l === 'enterprise' ? ENT : l === 'site' ? SITE : l === 'function' ? t.fn : t[l];
const leafName = (alt, t) => [...['area','line','cell'].filter(l => !alt.levels.includes(l)).map(l => t[l]), t.name].join('_');
function nodeKey(pairs) {
  const p = {...pairs};
  if (p.line) p.area = AREA_OF[p.line];
  return Object.keys(p).sort().map(k => k + '=' + p[k]).join('|');
}

function buildTree(alt) {
  const root = {key:nodeKey({enterprise:ENT}), level:'enterprise', name:ENT, path:ENT, children:[], kids:new Map(), parent:null, depth:0, tags:[]};
  for (const t of TAGS) {
    let n = root; const pairs = {enterprise:ENT};
    root.tags.push(t);
    for (let i = 1; i < alt.levels.length; i++) {

function renderPanels() {

  const tr = TREES[S.alt], alt = tr.alt, q = QUERIES[S.query];
  $('altName').textContent = alt.name; $('altDesc').textContent = alt.desc;
  $('chain').innerHTML = [...alt.levels, 'tag'].map(l => `<span class="chip lv-${l}"><i></i>${LEVEL[l]}</span>`).join('<span class="arr">/</span>');
  $('shape').innerHTML = ALTS.map(a => {
    const m = TREES[a.id].metrics, w = wildcard(a, q.q);
    return `<tr data-alt="${a.id}" aria-current="${a.id === S.alt}"><td>${a.name}</td><td class="n">${m.depth}</td><td class="n">${m.nodes}</td><td class="n">${m.avg.toFixed(1)}</td><td class="n">${w.matched.size}<span style="color:var(--faint)">/${w.wanted.size}</span></td></tr>`;
  }).join('');
  $('shape').querySelectorAll('tr').forEach(r => r.onclick = () => setAlt(r.dataset.alt));
  $('qchips').innerHTML = QUERIES.map((x, i) => `<button data-i="${i}" aria-pressed="${i === S.query}">${x.label}</button>`).join('');
  $('qchips').querySelectorAll('button').forEach(b => b.onclick = () => { S.query = +b.dataset.i; renderPanels(); applyClasses(TREES[S.alt]); });
  const w = wildcard(alt, q.q);
  $('pattern').innerHTML = w.pattern.map(s => s === '+' || s === '#' ? `<span class="w">${s}</span>` : esc(s)).join('<span class="k">/</span>');
  $('qMatch').textContent = w.matched.size; $('qWant').textContent = w.wanted.size; $('qNoise').textContent = w.matched.size - w.wanted.size;
  $('qBar').style.width = (w.wanted.size / w.matched.size * 100).toFixed(1) + '%';
}
$('hl').onchange = e => { S.highlight = e.target.checked; applyClasses(TREES[S.alt]); };

function segsFor(altId) {
  const tr = TREES[altId], n = tr.byKey.get('tag:' + S.pinned), out = [];
  for (let a = n; a; a = a.parent) out.unshift(a);
  return out;
}
function renderPin() {
  const box = $('path');
  const old = new Map([...box.querySelectorAll('.ps')].map(el => [el.dataset.k, el.getBoundingClientRect()]));
  const segs = segsFor(S.alt), t = segs.at(-1).tag;
  box.innerHTML = segs.map((n, i) => `${i ? '<span class="sl">/</span>' : ''}<span class="ps lv-${n.level}" data-k="${n.level === 'tag' ? 'tag' : n.level + '=' + n.name}"><span class="v">${esc(n.name)}</span><span class="l">${LEVEL[n.level]}</span></span>`).join('');
  if (!reduce) box.querySelectorAll('.ps').forEach((el, i) => {
    const o = old.get(el.dataset.k), r = el.getBoundingClientRect();
    if (o && old.size) el.animate([{transform:`translate(${o.left - r.left}px,${o.top - r.top}px)`}, {transform:'none'}], {duration:620, easing:'cubic-bezier(.6,0,.2,1)'});
    else if (old.size) el.animate([{opacity:0, transform:'translateY(8px)'}, {opacity:1, transform:'none'}], {duration:520, delay:120 + i * 25, easing:'cubic-bezier(.2,.7,.2,1)', fill:'backwards'});
  });
  const path = segs.at(-1).path;
  $('pinMeta').textContent = `${t.dt} · ${t.unit} · ${t.rate}`;
  $('pinStats').textContent = `${segs.length} levels · ${path.length} characters`;
  $('pinWas').innerHTML = S.prevAlt ? `<b>was in ${esc(ALTS.find(a => a.id === S.prevAlt).name)}:</b> ${esc(segsFor(S.prevAlt).at(-1).path)}` : '';
}

$('themeBtn').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
};
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = '123'.indexOf(e.key);
  if (i >= 0) setAlt(ALTS[i].id);
  else if (e.key === 't' || e.key === 'g') setView(e.key === 't' ? 'tree' : 'graph');
});

renderPanels(); renderPin();
requestAnimationFrame(() => update(true));
})();
</script>
